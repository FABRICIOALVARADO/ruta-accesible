name: Verificar Ruta Accesible

on:
  push:
    branches: [main, 'mejora/**']
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: Pruebas de FastAPI y SQLite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m unittest discover -s backend/tests -v
  frontend:
    name: Compilar interfaz Angular
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: angular-compilado
          path: frontend/dist/ruta-accesible/browser/
